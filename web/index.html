    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#05070c radial-gradient(900px 600px at 50% 38%,#0d1a33 0%,transparent 70%);transition:opacity .35s ease,visibility .35s}
      #splash.hide{opacity:0;visibility:hidden}
      #splash .in{display:grid;justify-items:center;gap:22px;animation:sp-in .45s ease-out both}
      #splash img{width:120px;height:auto;animation:sp-breathe 1.6s ease-in-out infinite}
      #splash .bar{width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
      #splash .bar::after{content:"";display:block;width:40%;height:100%;background:linear-gradient(90deg,transparent,#ecb546,transparent);animation:sp-sweep 1s ease-in-out infinite}
      @keyframes sp-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @keyframes sp-breathe{50%{opacity:.75;transform:scale(.98)}}
      @keyframes sp-sweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){#splash *,#splash *::after{animation:none!important}}
    </style>
